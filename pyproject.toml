[project]
name = "serl-plus-plus"
authors = [{ name = "song.liu" }]
version = "0.1"
description = "SERL Plus Plus"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.10.19"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "gymnasium==1.2.3",
    "mujoco==3.4.0",
    "numpy==1.24.4",
    "scipy==1.10.1",
    "opencv-python==4.9.0.80",
    "einops==0.8.1",
    "imageio==2.9.0",
    "imageio-ffmpeg==0.4.4",
    "timm==1.0.22",
    "wandb==0.23.1",
    "tqdm==4.67.1",
    "absl-py==0.13.0",
    "ml-collections==0.1.1",
    "zarr==2.16.1",
    "numcodecs==0.12.1",
    "agentlace @ git+https://github.com/youliangtan/agentlace.git@cf2c337c5e3694cdbfc14831b239bd657bc4894d",
    "pyzmq",
    "lz4",
    "typing_extensions",
    "pillow",
    "huggingface-hub",
    "safetensors",
    "easyhid==0.0.10",
    "open3d",
    "fpsample",
    "pyrealsense2",
    "hydra-core",
    "requests",
    "flask",
    "pynput>=1.8.2",
    "robosuite>=1.5.2",
]

[project.optional-dependencies]
# Only the insert_maniskill task needs these.  Do not hand-pin the transitive
# deps -- mani-skill 3.0.1 resolves against every pin above unchanged, and the
# 3.0.0bXX betas hard-pin gymnasium==0.29.1, so keep the >=3.0.1 floor.
maniskill = ["mani-skill>=3.0.1", "pyarrow"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["algorithm*", "config*", "infra*", "train*", "workspace*"]

[tool.setuptools.package-data]
config = ["*.yaml", "task/*.yaml"]
infra = [
    "sim/envs/assets/*.xml",
    "sim/envs/assets/*/*.xml",
    "sim/envs/assets/*/LICENSE",
    "sim/envs/assets/*/README.md",
    "sim/envs/assets/*/*/*.obj",
    "sim/envs/assets/*/assets/*.stl",
    # The robosuite object overrides ship their own mesh and texture.
    "sim/envs/assets/robosuite_objects/*.msh",
    "sim/envs/assets/robosuite_objects/*.png",
]

# PyTorch CUDA 12.4
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
