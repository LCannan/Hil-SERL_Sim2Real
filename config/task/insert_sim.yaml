name: insert_sim

training:
  batch_size: 256
  cta_ratio: 2
  discount: 0.97
  max_steps: 1000000
  replay_buffer_capacity: 200000
  random_steps: 0
  training_starts: 100
  steps_per_update: 50
  actor_update_period: 10
  log_period: 10
  encoder_type: resnet18-pretrained
  checkpoint_period: 5000
  buffer_period: 1000
  image_keys: [wrist1, wrist2]
  proprio_keys: [tcp_pose, tcp_vel, tcp_force, tcp_torque]
  enable_spacemouse: false

agent:
  _target_: algorithm.launch.make_sac_pixel_agent
  image_keys: ${task.training.image_keys}
  encoder_type: ${task.training.encoder_type}
  reward_bias: 0.0
  target_entropy: null
  discount: ${task.training.discount}

environment:
  _target_: infra.sim.envs.panda_insert_gym_env.PandaPegInsertGymEnv
  seed: 0
  control_dt: 0.02
  physics_dt: 0.002
  time_limit: 10.0
  render_spec:
    - _target_: infra.sim.envs.mujoco_gym_env.GymRenderingSpec
      camera_name: wrist1
      height: 128
      width: 128
      mode: rgb_array
    - _target_: infra.sim.envs.mujoco_gym_env.GymRenderingSpec
      camera_name: wrist2
      height: 128
      width: 128
      mode: rgb_array
  config:
    target_pose: [0.5, 0.0, 0.16, -1.0, 0.0, 0.0, 0.0] # xyz + quat (xyzw)
    reward_threshold: [0.015, 0.015, 0.015, 0.2, 0.2, 0.2]
    action_scale: [0.01, 0.02]
    reset_pose: [0.5, 0.0, 0.26, -1.0, 0.0, 0.0, 0.0] # xyz + quat (xyzw)
    random_reset: true
    random_xy_range: 0.05
    random_rx_range: 0.0
    random_ry_range: 0.0
    random_rz_range: 0.5235987755982988
    abs_xyz_limit_low: [0.45, -0.05, 0.16]
    abs_xyz_limit_high: [0.55, 0.05, 0.26]
    display_image: true
    max_episode_length: 100

wrappers:
  spacemouse: ${task.training.enable_spacemouse}
  relative_frame: true
  include_relative_pose: true
  quat_to_rotvec: true
  serl_observation: true
  chunking: true
  obs_horizon: 1
  act_exec_horizon: null
